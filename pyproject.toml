[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "careamics-syntax-highlighting"
version = "0.1.0"
description = "Python syntax-highlighting extensions for CAREamics documentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygments>=2.20"]

[project.entry-points."pygments.filters"]
careamics_semantic = "careamics_syntax_highlighting.semantic:CareamicsPythonSemanticFilter"

[tool.setuptools.packages.find]
where = ["src"]
